# `hello` manifest template for `scripts/e2e.sh` (NOT a real manifest:
# the script renders one file per version by replacing the `__TOKENS__`
# with the locally built artefact URL + sha256).
#
# - `__VERSION__`: 0.1.0, 0.1.1 or 0.1.2.
# - `__HELLO_NAME__`: greeting per version (0.1.1 changes it so the e2e
#   can observe the update; 0.1.2 keeps 0.1.1's name).
# - `__URL__` / `__SHA256__`: artefact server + computed digest.
# - `__EXTRA_ENV__`: empty for 0.1.0/0.1.1; `HELLO_FAIL = { value = "1" }`
#   for 0.1.2 (health 500 → update fails → rollback, spec §5).

schema = 1

[app]
id = "hello"
name = "Hello"
version = "__VERSION__"
homepage = "https://example.com/hello"
health = "/healthz"
admin_path = "/"
startup_grace_s = 30

[run]
kind = "binary"
workdir = "exec_dir"
args = []

[run.binary."x86_64-linux"]
url = "__URL__"
sha256 = "__SHA256__"
exec = "hello"

[needs]
postgres = ">=16"
dirs = []

[env]
HELLO_BIND = { from = "bind_addr" }
DATABASE_URL = { from = "postgres_url" }
HELLO_NAME = { value = "__HELLO_NAME__" }
__EXTRA_ENV__

[limits.default]
memory_mb = 512
cpu_percent = 100
disk_mb = 5120

[backup]
postgres = true
dirs = []

[update]
strategy = "replace"
