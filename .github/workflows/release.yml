name: Release

# A `v*` tag builds musl-static archives per platform (no emulation:
# x86_64 builds natively, aarch64 via `cross`), publishes the
# multi-arch image, and only then creates the GitHub release.
# Tags with a `-` (v0.1.0-rc.1) are prereleases and never move `latest`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"; publish=true
          else
            version="0.0.0-dev.${GITHUB_SHA::7}"; publish=false
          fi
          prerelease=false; [[ "$version" == *-* ]] && prerelease=true
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
      # Fail before building anything when the tag has no changelog entry.
      - if: steps.v.outputs.publish == 'true'
        run: scripts/release-notes.sh "${{ steps.v.outputs.version }}" > /dev/null

  ui:
    name: UI bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: bash scripts/build-ui.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  binary:
    name: Binary (${{ matrix.target }})
    needs: [meta, ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04, public_only: false }
          # Free arm64 Linux runners exist only for public repositories.
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, public_only: true }
    # A public-only entry on a private repository lands on an ordinary
    # runner where every step is skipped, instead of waiting for an arm64
    # runner that never comes.
    runs-on: ${{ (matrix.public_only && github.event.repository.private) && 'ubuntu-latest' || matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        if: ${{ !matrix.public_only || !github.event.repository.private }}
      - uses: actions/download-artifact@v4
        if: ${{ !matrix.public_only || !github.event.repository.private }}
        with:
          name: ui-dist
          path: ui/dist
      - uses: dtolnay/rust-toolchain@master
        if: ${{ !matrix.public_only || !github.event.repository.private }}
        with:
          toolchain: "1.99"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.public_only || !github.event.repository.private }}
        with:
          key: ${{ matrix.target }}
      - name: Install musl linker (x86_64)
        if: ${{ (!matrix.public_only || !github.event.repository.private) && matrix.target == 'x86_64-unknown-linux-musl' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Install cross (aarch64)
        if: ${{ (!matrix.public_only || !github.event.repository.private) && startsWith(matrix.target, 'aarch64') }}
        run: cargo install cross --locked
      - name: Build
        if: ${{ !matrix.public_only || !github.event.repository.private }}
        run: >
          ${{ startsWith(matrix.target, 'aarch64') && 'cross' || 'cargo' }}
          build --release --locked --target ${{ matrix.target }} --bin setu
      - name: Package
        if: ${{ !matrix.public_only || !github.event.repository.private }}
        run: >
          bash scripts/package-release.sh "${{ needs.meta.outputs.version }}"
          "${{ matrix.target }}" "target/${{ matrix.target }}/release" dist
      - uses: actions/attest-build-provenance@v2
        # Artifact attestations need a public repository on GitHub's free plan.
        if: ${{ (!matrix.public_only || !github.event.repository.private) && needs.meta.outputs.publish == 'true' && !github.event.repository.private }}
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        if: ${{ !matrix.public_only || !github.event.repository.private }}
        with:
          name: archive-${{ matrix.target }}
          path: dist/*

  image:
    name: Image (${{ matrix.platform }})
    needs: [meta, binary]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, target: x86_64-unknown-linux-musl, os: ubuntu-latest, public_only: false }
          - { platform: linux/arm64, target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, public_only: true }
    runs-on: ${{ (matrix.public_only && github.event.repository.private) && 'ubuntu-latest' || matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        if: ${{ !matrix.public_only || !github.event.repository.private }}
      - uses: docker/setup-buildx-action@v3
        if: ${{ !matrix.public_only || !github.event.repository.private }}
      - uses: docker/login-action@v3
        if: ${{ !matrix.public_only || !github.event.repository.private }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        if: ${{ !matrix.public_only || !github.event.repository.private }}
        with:
          name: archive-${{ matrix.target }}
          path: dist
      - name: Stage binary
        if: ${{ !matrix.public_only || !github.event.repository.private }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage-bin
          tar -xzf dist/setu-*.tar.gz -C /tmp/stage-bin
          cp /tmp/stage-bin/setu ./setu
      - id: build
        if: ${{ !matrix.public_only || !github.event.repository.private }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ needs.meta.outputs.publish }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Record digest
        if: ${{ !matrix.public_only || !github.event.repository.private }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        if: ${{ !matrix.public_only || !github.event.repository.private }}
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: digests/*

  manifest:
    name: Image manifest
    needs: [meta, image]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.meta.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.meta.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.prerelease == 'false' }}
      - name: Create manifest
        working-directory: digests
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

  release:
    name: GitHub release
    needs: [meta, binary, manifest]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - run: scripts/release-notes.sh "${{ needs.meta.outputs.version }}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            install.sh
